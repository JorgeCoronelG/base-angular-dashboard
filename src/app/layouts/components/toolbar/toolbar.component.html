<div
  [class.container]="isVerticalLayout()"
  class="toolbar text-default w-full px-6 flex items-center"
>
  <button
    (click)="openSidenav()"
    [class.hidden]="isDesktop()"
    mat-icon-button
    type="button"
  >
    <mat-icon svgIcon="mat:menu" />
  </button>

  @if (isVerticalLayout()) {
    <a [routerLink]="['/']" class="ltr:mr-4 rtl:ml-4 flex items-center">
      <img alt="Logo" class="w-8 select-none" src="assets/img/logo/logo.svg" />
      <h1
        [class.hidden]="isDesktop()"
        class="text-2xl font-bold tracking-wide ltr:pl-4 rtl:pr-4 m-0 select-none"
      >
        {{ title() }}
      </h1>
    </a>
  }

  @if ((isVerticalLayout()) && (isNavbarInToolbar())) {
    <div
      [class.hidden]="!(isDesktop())"
      class="px-6 flex-none flex items-center"
    >
      @for (item of navigationItems(); track item) {
        <vex-navigation-item [item]="item" />
      }
    </div>
  }

  <span class="flex-1"></span>

  <div class="-mx-1 flex items-center">
    <div class="px-1">
      <button (click)="openSearch()" mat-icon-button type="button">
        <mat-icon color="primary" svgIcon="mat:search" />
      </button>
    </div>

    <div class="px-1">
      <vex-toolbar-notifications />
    </div>

    <div class="px-1">
      <button (click)="openQuickpanel()" mat-icon-button type="button">
        <mat-icon color="primary" svgIcon="mat:bookmarks" />
      </button>
    </div>

    <div class="px-1">
      <button [matMenuTriggerFor]="languageMenu" mat-icon-button type="button">
        <mat-icon svgIcon="flag:united-states" />
      </button>
    </div>

    @if (userVisible()) {
      <div class="px-1">
        <vex-toolbar-user />
      </div>
    }

    <mat-menu
      #languageMenu="matMenu"
      overlapTrigger="false"
      xPosition="before"
      yPosition="below"
    >
      <button mat-menu-item>
        <mat-icon svgIcon="flag:united-states" />
        <span>English</span>
      </button>

      <button mat-menu-item>
        <mat-icon svgIcon="flag:germany" />
        <span>German</span>
      </button>
    </mat-menu>
  </div>
</div>

@if ((isVerticalLayout()) && (isNavbarBelowToolbar())) {
  <vex-navigation [class.hidden]="!(isDesktop())" />
}
