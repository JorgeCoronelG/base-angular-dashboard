<div class="flex items-center">
  <button (click)="open()" mat-icon-button>
    <mat-icon svgIcon="mat:search" />
  </button>
  <mat-form-field
    [class.search-open]="isOpen()"
    appearance="outline"
    class="search flex-auto"
  >
    <mat-label>Search&hellip;</mat-label>
    <input #input (blur)="close()" matInput />
  </mat-form-field>
</div>
