<div class="dropdown">
  <div class="dropdown-header flex items-center justify-between">
    <div class="flex items-center">
      <div class="dropdown-heading-icon flex items-center justify-center">
        <mat-icon svgIcon="mat:person" />
      </div>
      <div class="dropdown-heading">David Smith</div>
    </div>

    <button
      [matMenuTriggerFor]="settingsMenu"
      mat-icon-button
      matTooltip="Settings"
      matTooltipPosition="before"
      type="button"
    >
      <mat-icon class="notifications-header-icon" svgIcon="mat:settings" />
    </button>
  </div>

  <div class="dropdown-content">
    @for (item of items; track trackById($index, item)) {
      <a
        (click)="close()"
        [routerLink]="item.route"
        class="notification flex items-center"
        matRipple
      >
        <mat-icon
          [ngClass]="item.colorClass"
          [svgIcon]="item.icon"
          class="notification-icon flex-none"
        />
        <div class="flex-auto">
          <div class="notification-label">{{ item.label }}</div>
          <div class="notification-description">{{ item.description }}</div>
        </div>
        <mat-icon
          class="notification-chevron flex-none"
          svgIcon="mat:chevron_right"
        />
      </a>
    }
  </div>

  <div class="dropdown-footer flex items-center justify-between">
    <button
      [matMenuTriggerFor]="statusMenu"
      class="dropdown-footer-select"
      mat-button
      type="button"
    >
      @for (status of statuses; track trackById($index, status)) {
        @if (status === activeStatus) {
          <span>
            <mat-icon [ngClass]="status.colorClass" [svgIcon]="status.icon" />
            <span>{{ status.label }}</span>
            <mat-icon
              class="dropdown-footer-select-caret"
              svgIcon="mat:arrow_drop_down"
            />
          </span>
        }
      }
    </button>
    <a (click)="close()" [routerLink]="['/login']" color="primary" mat-button
      >Logout</a
    >
  </div>
</div>

<mat-menu #statusMenu="matMenu" xPosition="before" yPosition="below">
  @for (status of statuses; track trackById($index, status)) {
    <button (click)="setStatus(status)" mat-menu-item>
      <mat-icon [ngClass]="status.colorClass" [svgIcon]="status.icon" />
      <span>{{ status.label }}</span>
    </button>
  }
</mat-menu>

<mat-menu #settingsMenu="matMenu" xPosition="before" yPosition="below">
  <button mat-menu-item>
    <mat-icon svgIcon="mat:business" />
    <span>Change Address</span>
  </button>

  <button mat-menu-item>
    <mat-icon svgIcon="mat:verified_user" />
    <span>Change Username</span>
  </button>

  <button mat-menu-item>
    <mat-icon svgIcon="mat:lock" />
    <span>Change Password</span>
  </button>

  <button mat-menu-item>
    <mat-icon svgIcon="mat:notifications_off" />
    <span>Disable Notifications</span>
  </button>
</mat-menu>
