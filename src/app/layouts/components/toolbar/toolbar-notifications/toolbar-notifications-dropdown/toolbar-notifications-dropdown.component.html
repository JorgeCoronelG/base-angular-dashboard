<div class="dropdown">
  <div class="dropdown-header">
    <div class="dropdown-heading">Notifications</div>
    <div class="dropdown-subheading">
      @if (unreadCount() > 0) {
        You have {{ unreadCount() }} unread notifications.
      } @else {
        You are all caught up.
      }
    </div>
  </div>

  <div class="dropdown-content">
    @for (notification of notifications(); track notification.id) {
      <div
        [class.read]="notification.read"
        class="notification flex items-center"
      >
        <mat-icon
          [class]="notification.colorClass"
          [svgIcon]="notification.icon"
          class="notification-icon flex-none"
        />
        <div class="flex-auto">
          <div class="notification-label">{{ notification.label }}</div>
          <div class="notification-description">
            {{ notification.datetime | appDateFormatRelative }}
          </div>
        </div>
      </div>
    } @empty {
      <div class="py-8 px-6 text-center text-secondary text-sm">
        No notifications
      </div>
    }
  </div>

  <div class="dropdown-footer flex items-center justify-center">
    <button
      (click)="markAllAsRead()"
      [disabled]="unreadCount() === 0"
      color="primary"
      mat-button
      type="button"
    >
      Mark all as read
    </button>
  </div>
</div>
