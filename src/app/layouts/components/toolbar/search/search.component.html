<div [class.show]="show()" class="search">
  <button
    (click)="close()"
    class="ltr:right-12 rtl:left-12 top-12 absolute"
    color="primary"
    mat-icon-button
    type="button"
  >
    <mat-icon svgIcon="mat:close" />
  </button>

  <input
    #searchInput
    (keyup.enter)="search()"
    (keyup.escape)="close()"
    [formField]="searchForm.query"
    class="search-input"
    placeholder="Search..."
  />
  <div class="search-hint">Hit enter to search</div>
</div>

@if (show()) {
  <div (click)="close()" class="search-overlay" role="presentation"></div>
}
