<div
  [class.vex-layout-boxed]="config().boxed"
  [class.vex-layout-footer-enabled]="isFooterVisible()"
  [class.vex-layout-footer-fixed]="config().footer.fixed && isFooterVisible()"
  [class.vex-layout-horizontal]="config().layout === 'horizontal'"
  [class.vex-layout-scroll-disabled]="scrollDisabled()"
  [class.vex-layout-search-overlay-open]="searchOpen()"
  [class.vex-layout-sidenav-collapsed]="sidenavCollapsed()"
  [class.vex-layout-toolbar-fixed]="config().toolbar.fixed"
  [class.vex-layout-vertical]="config().layout === 'vertical'"
  class="vex-base-layout-container"
>
  <ng-content />
</div>
